<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hold Down Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Hold Down Timer</h1>

    <div class="hold-wrapper">
      <button id="holdBtn" class="hold-btn">
        <span id="btnLabel" class="btn-label">—</span>
        <span id="btnSub" class="btn-sub">Hold to start</span>
      </button>
    </div>

    <section class="list-section">
      <div class="list-header">
        <h2>Times</h2>
        <button id="resetBtn" class="reset-btn">Reset</button>
      </div>
      <ol id="timeList" class="time-list">
        <li class="empty-msg">No times recorded yet.</li>
      </ol>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
