<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hold Down Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <nav class="tabs" aria-label="Stopwatch mode">
      <button class="tab-btn active" data-tab="classic" type="button">Classic</button>
      <button class="tab-btn" data-tab="delay5" type="button">Delay 5s</button>
    </nav>

    <section class="tab-panel active" data-panel="classic">

      <!-- Top panel: compact top-3 leaderboard + reset -->
      <div class="top-panel">
        <div class="top-panel-header">
          <span class="top-panel-title">Top 3</span>
          <button id="resetBtn" class="reset-btn">Reset</button>
        </div>
        <ol id="topList" class="top-list">
          <li class="top-list-empty">No times yet</li>
        </ol>
      </div>

      <!-- Hold button – absolutely positioned so its centre sits at 1/3 from the bottom -->
      <div class="hold-wrapper">
        <button id="holdBtn" class="hold-btn">
          <span id="btnLabel" class="btn-label">—</span>
          <span id="btnSub" class="btn-sub">Hold to start</span>
        </button>
      </div>

      <!-- Full list of all recorded times -->
      <section class="list-section">
        <h2 class="list-title">All Times</h2>
        <ol id="timeList" class="time-list">
          <li class="empty-msg">No times recorded yet.</li>
        </ol>
      </section>
    </section>

    <section class="tab-panel" data-panel="delay5">

      <div class="top-panel">
        <div class="top-panel-header">
          <span class="top-panel-title">Top 3</span>
          <button id="resetBtnDelay" class="reset-btn">Reset</button>
        </div>
        <ol id="topListDelay" class="top-list">
          <li class="top-list-empty">No times yet</li>
        </ol>
      </div>

      <div class="hold-wrapper">
        <button id="holdBtnDelay" class="hold-btn hold-btn-delay">
          <span id="btnLabelDelay" class="btn-label">—</span>
          <span id="btnSubDelay" class="btn-sub">Click to start (5s delay)</span>
        </button>
      </div>

      <section class="list-section">
        <h2 class="list-title">All Times</h2>
        <ol id="timeListDelay" class="time-list">
          <li class="empty-msg">No times recorded yet.</li>
        </ol>
      </section>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
