<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hold Down Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- Top panel: compact top-3 leaderboard + reset -->
    <div class="top-panel">
      <div class="top-panel-header">
        <span class="top-panel-title">Top 3</span>
        <button id="resetBtn" class="reset-btn">Reset</button>
      </div>
      <ol id="topList" class="top-list">
        <li class="top-list-empty">No times yet</li>
      </ol>
    </div>

    <!-- Hold button – absolutely positioned so its centre sits at 1/3 from the bottom -->
    <div class="hold-wrapper">
      <button id="holdBtn" class="hold-btn">
        <span id="btnLabel" class="btn-label">—</span>
        <span id="btnSub" class="btn-sub">Hold to start</span>
      </button>
    </div>

    <!-- Full list of all recorded times -->
    <section class="list-section">
      <h2 class="list-title">All Times</h2>
      <ol id="timeList" class="time-list">
        <li class="empty-msg">No times recorded yet.</li>
      </ol>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
